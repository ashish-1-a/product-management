name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # Backend SAST + Dependency Security
  # ==========================================
  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Ruff
        working-directory: backend
        run: |
          ruff check . --fix \
            --ignore B008 \
            --per-file-ignores "app/db/migrations/**:UP007"

          ruff format .

          ruff check . \
            --ignore B008 \
            --per-file-ignores "app/db/migrations/**:UP007"

      - name: Bandit SAST
        working-directory: backend
        run: |
          bandit -r app -ll || true

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip-audit || true

      - name: Semgrep SAST
        run: |
          python -m pip install semgrep
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --error \
            backend/app || true


  # ==========================================
  # Frontend Security
  # ==========================================
  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: NPM dependency audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high || true

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Semgrep SAST
        run: |
          python -m pip install semgrep
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --error \
            frontend/src || true


  # ==========================================
  # Secret Scanning
  # ==========================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # Docker Image Security
  # ==========================================
  docker-security:
    name: Docker Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # Backend image
      # ----------------------------------------
      - name: Build backend image
        run: |
          docker build \
            --no-cache \
            --pull \
            --provenance=false \
            --sbom=false \
            -t product-management-backend:security \
            ./backend

      - name: Verify backend dependencies
        run: |
          docker run --rm \
            --entrypoint python \
            product-management-backend:security \
            -c "import setuptools, msgpack; print('setuptools:', setuptools.__version__); print('msgpack:', msgpack.__version__)"

      # ----------------------------------------
      # Frontend image
      # ----------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --no-cache \
            --pull \
            --provenance=false \
            --sbom=false \
            -t product-management-frontend:security \
            ./frontend

      # ----------------------------------------
      # Trivy
      # ----------------------------------------
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.74.0

      - name: Scan backend image
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            product-management-backend:security

      - name: Scan frontend image
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            product-management-frontend:security


  # ==========================================
  # OWASP Dependency Check
  # ==========================================
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Product Management"
          path: "."
          format: "HTML"
          out: "reports"

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports
