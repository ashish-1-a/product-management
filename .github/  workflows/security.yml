name: Security Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Bandit
        working-directory: backend
        run: bandit -r app -ll

      - name: Dependency Audit
        working-directory: backend
        run: pip-audit


  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: NPM Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  docker-security:
    name: Docker Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t product-management-backend:security \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t product-management-frontend:security \
            ./frontend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: product-management-backend:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: product-management-frontend:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
